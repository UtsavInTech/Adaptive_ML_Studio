# Traceability: pipeline component ↔ technique ↔ review-paper reference ↔ research gap.
# Owned by the Review / Literature member, who sets `verified_by` / `status` after checking.
# The implementation fills in `implemented_in` and `technique`. Rendered on the Method page.
gaps:
  G1: Limited integration of multiple adaptive components into a unified pipeline
  G2: Accuracy evaluated without the computational cost of continuous adaptation
  G3: Latency not evaluated consistently together with accuracy
  G4: Limited evaluation of complete adaptive pipelines under real-world edge constraints
  G5: Limited dynamic adaptation based simultaneously on data drift and available resources
  G6: Different datasets, metrics and environments make comparison difficult
components:
  - component: Adaptive preprocessing
    technique: Running-mean imputation; exponentially weighted standardisation (fading factor 0.001); clipping at 5σ
    references: ["[3] Žliobaitė & Gabrys 2014", "[17] Niloy et al. 2025", "[19] Gupta & Hewett 2019"]
    gaps: [G1]
    implemented_in: backend/adaptiveml/preprocessing
    status: implemented
    verified_by: pending
  - component: Online feature selection
    technique: Relevance = |weight| of an online logistic regression; keep the top-k (the truncation step of OFS, adapted — not a full OFS re-implementation)
    references: ["[4] Hoi et al. 2012", "[16] Hochma & Last 2025"]
    gaps: [G1, G2]
    implemented_in: backend/adaptiveml/features
    status: implemented
    verified_by: pending
  - component: Concept drift detection
    technique: ADWIN on the model's 0/1 error stream (warning δ 0.01, drift δ 0.002); acts only on error increases
    references: ["[5] Bifet & Gavaldà 2007"]
    gaps: [G1, G3]
    implemented_in: backend/adaptiveml/drift
    status: implemented
    verified_by: pending
  - component: Incremental learning
    technique: Hoeffding tree (River), test-then-train; alternatives logistic regression, Gaussian NB
    references: ["[10] Montiel et al. 2021 (River)", "[18] Zhang et al. 2021"]
    gaps: [G1]
    implemented_in: backend/adaptiveml/models
    status: implemented
    verified_by: pending
  - component: Model adaptation
    technique: Replacement model trained from the warning/detection, promoted after 200 samples (background-learner strategy of ARF); reset when background models are disallowed
    references: ["§VI options: choose the right model / retrain if necessary", "[20] Gomes et al. 2017 (background learners)"]
    gaps: [G1, G2]
    implemented_in: backend/adaptiveml/adaptation, backend/adaptiveml/pipeline
    status: implemented
    verified_by: pending
  - component: Resource-aware adaptation
    technique: Block-level governor under a simulated budget — raise update stride, then reduce features; every decision logged
    references: ["[12] Petri et al. 2022", "[14] Disabato & Roveri 2024", "[15] Lourenço et al. 2026 (DFDT)", "§VI: change the processing configuration"]
    gaps: [G4 (partial — simulated), G5]
    implemented_in: backend/adaptiveml/adaptation/resources.py, backend/adaptiveml/config/profiles.py
    status: implemented (placeholder budget values)
    verified_by: pending
  - component: Monitoring
    technique: Per-stage timing per sample (contiguous stages), CPU time per block, process CPU/RSS sampled from outside, model-size estimate
    references: ["§VI metrics: accuracy, F1, prediction latency, model-update time, computational overhead, memory"]
    gaps: [G2, G3]
    implemented_in: backend/adaptiveml/engine, backend/adaptiveml/metrics, backend/adaptiveml/api/live.py
    status: implemented
    verified_by: pending
  - component: Unified evaluation
    technique: One config schema, fixed seeds, isolated trials, result bundles with environment and hashes; re-run reproducibility check
    references: ["Table III — unified evaluation gap"]
    gaps: [G6]
    implemented_in: backend/adaptiveml/results, backend/adaptiveml/experiments
    status: implemented
    verified_by: pending
  - component: Comparator — adaptive ensemble
    technique: Adaptive Random Forest (River ARFClassifier, 10 trees) as an existing adaptive approach
    references: ["[20] Gomes et al. 2017"]
    gaps: [G2]
    implemented_in: backend/adaptiveml/pipeline (method preset "arf")
    status: implemented (choice of comparators is a Research + Review decision)
    verified_by: pending
  - component: Comparator — streaming random patches
    technique: River SRPClassifier, 10 Hoeffding trees on random feature subsets with bootstrap weights and per-member drift detection
    references: ["Gomes, Read & Bifet 2019, Streaming Random Patches for Evolving Data Stream Classification, ICDM (not in the review's reference list)"]
    gaps: [G2, G6]
    implemented_in: backend/adaptiveml/models, backend/adaptiveml/pipeline (method preset "srp")
    status: implemented (research testbed phase 2; Review to confirm it as a second comparator)
    verified_by: pending
  - component: Comparator — leveraging bagging
    technique: River LeveragingBaggingClassifier, 10 Hoeffding trees, Poisson(6) bagging with ADWIN per member
    references: ["Bifet, Holmes & Pfahringer 2010, Leveraging Bagging for Evolving Data Streams, ECML PKDD (not in the review's reference list)", "[5] Bifet & Gavaldà 2007 (ADWIN)"]
    gaps: [G2, G6]
    implemented_in: backend/adaptiveml/models, backend/adaptiveml/pipeline (method preset "lev_bag")
    status: implemented (research testbed phase 2; Review to confirm it as a second comparator)
    verified_by: pending
  - component: Reference baseline and temporal-dependence scores
    technique: '"Repeat last label" (no-change) classifier; Cohen''s kappa, kappa-temporal against the no-change classifier, macro-F1; per-label and per-attack-period scores'
    references: ["Žliobaitė, Bifet, Read, Pfahringer & Holmes 2015, Evaluation methods and decision theory for classification of streaming data with temporal dependence, Machine Learning 98", "Bifet et al. 2015, Efficient Online Evaluation of Big Data Stream Classifiers, KDD"]
    gaps: [G6]
    implemented_in: backend/adaptiveml/models (NoChangeClassifier), backend/adaptiveml/metrics
    status: implemented (research testbed phase 2)
    verified_by: pending
  - component: Joint drift-and-resource controller (R1-R5)
    technique: Per-row rule ladder reading drift, rolling accuracy, per-row deadline misses, CPU share of budget (EWMA of service time) and model memory; R5 memory > R3 latency (fewer features, narrow preprocessing, thinned updates; relaxes when calm) > R1/R2 drift handling chosen by resource state > R4 buffered retraining with spare resources; per-rule and resource-check ablation switches
    references: ["§6.2 decision rules R1-R5 and §VI: adapt the adaptation process to data and resources", "§4.3 cost model C_total", "[12] Petri et al. 2022", "[14] Disabato & Roveri 2024"]
    gaps: [G2, G3, G4 (partial — simulated budgets), G5]
    implemented_in: backend/adaptiveml/joint_controller.py, backend/adaptiveml/pipeline (method preset "joint"), backend/adaptiveml/metrics (cost_terms)
    status: implemented (research testbed phase 3; placeholder budgets)
    verified_by: pending
  - component: Budgeted effort controller (proposed method "effort")
    technique: 'Per-row choice of an effort level (preprocessing width, sampled scaler statistics with a gap-aware fading factor, sampled live feature ranking over all inputs, selective model update on easy rows) by a dual variable (price of compute, λ ← clip(λ + η(c/B − 1), 0, λ_max)) that holds the CPU budget on average, weighted by an activity signal (label-switch rate, error rate, drift alarms); per-row deadline and memory as hard limits (R5, deadline → gated feature cuts with a floor of 8, then thinned updates); repairs: fast replacement switch, damped re-alarms, delay-aware adaptation; deterministic decisions from a calibrated per-stage cost model; every lever and repair switchable for ablations'
    references: ["§6.3 configuration θ minimising J under hard limits", "§4.3 cost model C_total", "RCCDA (NeurIPS 2025) — Lyapunov update/no-update control under an average budget", "Online Cascade Learning (Nie et al., ICML 2024)", "research_testbed/research/METHOD.md"]
    gaps: [G2, G3, G4 (partial — simulated budgets), G5]
    implemented_in: backend/adaptiveml/effort_controller.py, backend/adaptiveml/pipeline (Levers, _process_effort), backend/adaptiveml/preprocessing (gap-aware scaler), backend/adaptiveml/config/schema.py (EffortConfig, EffortLevel, EffortCostModel), research_testbed/scripts/calibrate_effort_cost.py
    status: implemented (research testbed; under evaluation)
    verified_by: backend/tests/test_effort_controller.py; research_testbed/research/effort_results.md (exploratory, one seed)
  - component: Testbed scale and evaluation protocol
    technique: Simulated device tiers (placeholder budgets); replay from any row; recorded arrival rate with speed-up driving the per-row CPU budget; delayed and partial labels; parallel fleet runner; fixed protocol (protocol.yaml v1) with block-bootstrap confidence intervals, Friedman / Iman-Davenport and Nemenyi critical difference; report generator with run IDs on every table
    references: ["Table III — unified evaluation gap", "§VI: compare with existing adaptive approaches", "Demšar 2006, Statistical Comparisons of Classifiers over Multiple Data Sets, JMLR 7", "Gomes et al. 2019 / Žliobaitė et al. 2015 on delayed labels and temporal dependence (not in the review's reference list)"]
    gaps: [G4 (partial — simulated), G6]
    implemented_in: backend/adaptiveml/config/profiles.py, backend/adaptiveml/stream/streaming.py, backend/adaptiveml/pipeline, backend/adaptiveml/experiments/runner.py, backend/adaptiveml/analysis, research_testbed/protocol, research_testbed/scripts
    status: implemented (research testbed phases 4-5; full protocol not yet run)
    verified_by: pending
