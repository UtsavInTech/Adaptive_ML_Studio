name: "Demo — abrupt concept drift (validated scenario)"
description: >
  SEA concept 0 → 3 (13.1 % of the input space changes label) at sample 10,000; label noise 0.05;
  200 samples/s. This configuration passed the pre-registered held-out validation (check 4b, 20/20 seeds).
config:
  seed: 42
  methods: [static, adaptive]
  stream: {length: 16000, noise: 0.05, rate: 200, drifts: [{position: 10000, to_variant: 3}]}
  evaluation: {block_size: 25}
