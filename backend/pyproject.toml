[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiveml"
version = "0.1.0"
description = "AdaptiveML Studio — adaptive ML experimentation and monitoring platform for evolving data streams"
requires-python = ">=3.11"
dependencies = [
    "river==0.26.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["adaptiveml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
