<svg width="96" height="96" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AdaptiveML Studio">
  <title>AdaptiveML Studio</title>
  <!-- the static baseline: unchanged by the drift, and left behind by it -->
  <path d="M3 19 H29" stroke="#8B97A8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3.5"/>
  <!-- the adaptive curve: steady, a dip at the change, then recovery -->
  <path d="M3 13 H11 C13.5 13 13.8 24 16.5 24 C19.5 24 19.5 9 23 9 H29"
        stroke="#3B6AE5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points along the stream -->
  <circle cx="3" cy="13" r="2.1" fill="#3B6AE5"/>
  <circle cx="16.5" cy="24" r="2.1" fill="#3B6AE5" fill-opacity="0.55"/>
  <circle cx="29" cy="9" r="2.6" fill="#3B6AE5"/>
</svg>
